name: Auto-fill PR from commits

on:
  workflow_call:

permissions:
  pull-requests: write
  contents: read

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              }
            );

            const messages = commits.map(c => `- ${c.commit.message.split('\n')[0]}`);
            const breaking = commits.some(c =>
              c.commit.message.includes('BREAKING CHANGE')
            );

            let body = pr.body || '';

            const section = `
## 🔍 What Changed
${messages.join('\n')}
`;

            body = body.replace(
              /## 🔍 What Changed[\s\S]*?(?=\n##|\n---|$)/,
              section
            );

            if (!body.includes('## 🔍 What Changed')) {
              body += section;
            }

            if (breaking && !body.includes('## ⚠️ Breaking Changes')) {
              body += `
## ⚠️ Breaking Changes
⚠️ This PR contains breaking changes.
`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body,
            });
